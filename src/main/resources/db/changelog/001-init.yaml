databaseChangeLog:
  - changeSet:
      id: 001-create-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: user

      changes:
        - createTable:
            tableName: user

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: telegram_id
                  type: bigint

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: username
                  type: varchar(32)

              - column:
                  name: first_name
                  type: varchar(64)

                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: varchar(64)

              - column:
                  name: is_bot
                  type: boolean

                  constraints:
                    nullable: false

              - column:
                  name: registered_at
                  type: timestamp

                  constraints:
                    nullable: false

              - column:
                  name: last_seen_at
                  type: timestamp

                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: user

  - changeSet:
      id: 002-create-chat
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: chat

      changes:
        - createTable:
            tableName: chat

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user1_id
                  type: bigint

                  constraints:
                    nullable: false

              - column:
                  name: user2_id
                  type: bigint

                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp

                  constraints:
                    nullable: false

              - column:
                  name: closed_at
                  type: timestamp

      rollback:
        - dropTable:
            tableName: chat

  - changeSet:
      id: 003-add-fk-chat-user1
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: chat

            - tableExists:
                tableName: user

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: chat_user1_id_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: chat
            baseColumnNames: user1_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: chat_user1_id_fk

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: chat
            constraintName: chat_user1_id_fk

  - changeSet:
      id: 004-add-fk-chat-user2
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: chat

            - tableExists:
                tableName: user

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: chat_user2_id_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: chat
            baseColumnNames: user2_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: chat_user2_id_fk

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: chat
            constraintName: chat_user2_id_fk

  - changeSet:
      id: 005-create-message
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: message

      changes:
        - createTable:
            tableName: message

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: telegram_id
                  type: int

              - column:
                  name: chat_id
                  type: bigint

                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: bigint

                  constraints:
                    nullable: false

              - column:
                  name: sent_at
                  type: timestamp

                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: message

  - changeSet:
      id: 006-add-fk-message-chat
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: message

            - tableExists:
                tableName: chat

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: message_chat_id_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: message
            baseColumnNames: chat_id
            referencedTableName: chat
            referencedColumnNames: id
            constraintName: message_chat_id_fk

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: message
            constraintName: message_chat_id_fk

  - changeSet:
      id: 007-add-fk-message-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: message

            - tableExists:
                tableName: user

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: message_user_id_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: message
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: message_user_id_fk

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: message
            constraintName: message_user_id_fk

  - changeSet:
      id: 008-create-table-content
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: content

      changes:
        - createTable:
            tableName: content

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: message_id
                  type: bigint

                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(20)

                  constraints:
                    nullable: false

              - column:
                  name: text
                  type: text

              - column:
                  name: telegram_file_id
                  type: bigint

      rollback:
        - dropTable:
            tableName: content

  - changeSet:
      id: 009-add-fk-content-message
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: content

            - tableExists:
                tableName: message

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: content_message_id_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: content
            baseColumnNames: message_id
            referencedTableName: message
            referencedColumnNames: id
            constraintName: content_message_id_fk

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: content
            constraintName: content_message_id_fk

  - changeSet:
      id: 010-add-content-type-check
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - tableExists:
            tableName: content

      changes:
        - sql:
            sql: |
              ALTER TABLE content
              ADD CONSTRAINT content_type_chk
              CHECK (type IN ('TEXT', 'PHOTO', 'VIDEO', 'ANIMATION', 'VOICE', 'DOCUMENT', 'STICKER'));

      rollback:
        - sql:
            sql: |
              ALTER TABLE content
              DROP CONSTRAINT content_type_chk;